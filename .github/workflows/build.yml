name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute version
        run: echo "VERSION=1.0.$(( ${{ github.run_number }} - 1 ))" >> "$GITHUB_ENV"

      - name: Build
        run: mvn clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxPvPManager
          path: target/BoxPvPManager.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Build v${{ env.VERSION }}"
          make_latest: true
          files: |
            target/BoxPvPManager.jar
            resourcepack/BoxPvP-ResourcePack.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
