name: BoxPvPManager
main: com.dziubek.boxpvp.BoxPvpPlugin
version: 1.0.0
api-version: '1.21'
author: Dziubek
prefix: VantaNet
description: VantaNet - Box PvP - jeden wspolny spawn, combat log, TPA, kity, daily, sklep, skrzynie, generatory blokow i handlarze

commands:
  setsurvivalspawn:
    description: Ustawia spawn w miejscu gdzie stoisz
    usage: /setsurvivalspawn
    permission: boxpvp.setspawn
  spawn:
    description: Teleportuje na spawn (zablokowane podczas walki)
    usage: /spawn
  tpa:
    description: Wysyla prosbe o teleportacje do gracza
    usage: /tpa <gracz>
  tpaccept:
    description: Akceptuje prosbe o teleportacje
    usage: /tpaccept
  tpdeny:
    description: Odrzuca prosbe o teleportacje
    usage: /tpdeny
  kit:
    description: Odbiera kit, tworzy go (admin) lub migruje stare kity - /kit create <nazwa>, /kit migrate
    usage: /kit <nazwa> lub /kit create <nazwa> lub /kit migrate
  daily:
    description: Odbiera codzienna nagrode (z efektem) lub konfiguruje dzien/efekt (admin) - /daily setday <1-7>, /daily seteffect <efekt>
    usage: /daily lub /daily setday <1-7> lub /daily seteffect <efekt>
  crate:
    description: Skrzynie - otwiera sie TYLKO klikajac fizyczny blok (/crate bind) - /crate create|givekey|bind|unbind|sethologram|seteffect|setidleeffect|setprivate|setfreecooldown|setdisplayheight|purgedisplays|preview|list
    usage: /crate create|givekey|bind|unbind|sethologram|seteffect|setidleeffect|setprivate|setfreecooldown|preview|list
  sklep:
    description: Otwiera sklep z GUI - /sklep create|additem|removeitem|removecategory do konfiguracji (admin)
    usage: /sklep
  bpvp:
    description: Generatory, handlarze, auto-sprzedaz, eventy, leaderboardy, blokada craftingu, zestawy PvP i teleport do skrzynek - /bpvp wand|create|remove|list|villager|sellprice|event|leaderboard|craftblock|giveset|teleportto
    usage: /bpvp wand|create <nazwa> <blok> <sekundy>|remove <nazwa>|list|villager create|remove <nazwa>|sellprice set|remove|list|event start|envoy|setpoint|envoyitem|leaderboard setlocation|craftblock add|remove|list|giveset <poziom 1-10>|teleportto normal|mega|megazombie
  prestige:
    description: Oddaje cala gotowke za trwaly mnoznik zarobkow (auto-sprzedaz i zabojstwa) - /prestige confirm
    usage: /prestige [confirm]
  stats:
    description: Otwiera GUI z Twoimi statystykami (zabojstwa, smierci, K/D, monety, prestiz, seria, skrzynie)
    usage: /stats
  party:
    description: Druzyny - /party create|invite|accept|leave|kick|list
    usage: /party create|invite <gracz>|accept|leave|kick <gracz>|list
  missions:
    description: Otwiera GUI z dziennymi/tygodniowymi misjami i odbiorem nagrod
    usage: /missions
  gamma:
    description: Przelacza stale night vision (zamiennik gammy)
    usage: /gamma
  bank-serwer:
    description: Kantor - kup/sprzedaj fizyczne banknoty (slonecznik, zelazo, zloto, diament, netheryt) za monety u NPC, wyplac czek - /bank-serwer create|remove|list|price
    usage: /bank-serwer create <nazwa>|remove <nazwa>|list|price set|remove|list
  wymiana:
    description: Wystawia trzymany przedmiot na Rynku na 3 dni - /wymiana <cena>
    usage: /wymiana <cena>
  rynek:
    description: Otwiera GUI Rynku graczy - kupuj przedmioty wystawione przez innych graczy za monety
    usage: /rynek
  duel:
    description: Pojedynki 1v1 na zaklad - samo /duel otwiera GUI matchmakingu (dobiera przeciwnika), albo wyzwij kogos wprost - /duel invite|accept|leave|stop|admincheck
    usage: /duel - GUI matchmakingu, /duel invite <gracz> <stawka>|accept|leave|stop <gracz>|admincheck <gracz>
    aliases: [duels]
  reportduel:
    description: Zglasza Twoj trwajacy pojedynek adminom online
    usage: /reportduel [powod]
  playtime:
    description: Pokazuje Twoj laczny czas gry na serwerze i czas do nastepnej nagrody
    usage: /playtime
  trade:
    description: Bezpieczna wymiana przedmiotow z innym graczem - /trade <gracz>|accept|cancel
    usage: /trade <gracz>|accept|cancel
  lms:
    description: Zapisy na event Ostatni Ocalaly (admin startuje przez /bpvp event lms) - /lms join|leave
    usage: /lms join|leave
  elo:
    description: Pokazuje Twoj ranking ELO z pojedynkow (/duel) albo /elo top 10 najlepszych - sezon resetuje sie co 14 dni z nagroda dla TOP 3
    usage: /elo|top|season
  booster:
    description: Pokazuje Twoj aktywny booster zarobkow kupiony w /sklep
    usage: /booster
  rotshop:
    description: Otwiera rotujacy sklep - co godzine inna oferta specjalna z rabatem 20-50%
    usage: /rotshop
  vanish:
    description: Przelacza Twoja niewidzialnosc dla zwyklych graczy (admin)
    usage: /vanish
    permission: boxpvp.admin
  reloadpack:
    description: Wysyla resource pack ponownie do wszystkich online graczy (admin)
    usage: /reloadpack
    permission: boxpvp.admin
  reloadhud:
    description: Pobiera hud-config.json z GitHuba na zywo i odswieza HUD (admin)
    usage: /reloadhud
    permission: boxpvp.admin
  freeze:
    description: Zamraza/odmraza gracza (zero ruchu) - do zlapania na goracym uczynku (admin)
    usage: /freeze <gracz>
    permission: boxpvp.admin
  report:
    description: Ogolne zgloszenie gracza administracji (inne niz /reportduel)
    usage: /report <gracz> [powod]
  sprawdz:
    description: Zabiera podejrzanego gracza (i Ciebie) do wyznaczonego miejsca sprawdzania i trzyma go tam do /sprawdz z (admin)
    usage: /sprawdz setpoint|<gracz>|z <gracz>
    permission: boxpvp.admin
  clan:
    description: Trwale klany z tagiem na czacie i wspolnym bankiem - /clan create|invite|accept|leave|kick|disband|info|list|bank
    usage: /clan create <tag>|invite <gracz>|accept|leave|kick <gracz>|disband|info [tag]|list|bank deposit|withdraw <kwota>
  friend:
    description: Lista znajomych z powiadomieniem o dolaczeniu - /friend add|remove|list
    usage: /friend add <gracz>|remove <gracz>|list

softdepend: [WorldGuard, Vault, DecentHolograms, LuckPerms, EcoItems]

permissions:
  boxpvp.setspawn:
    description: Pozwala ustawic spawn
    default: op
  boxpvp.crate.admin:
    description: Pozwala zarzadzac skrzyniami (create, givekey)
    default: op
  boxpvp.shop.admin:
    description: Pozwala zarzadzac sklepem (create, additem, removeitem, removecategory)
    default: op
  boxpvp.daily.admin:
    description: Pozwala konfigurowac nagrody daily
    default: op
  boxpvp.kit.admin:
    description: Pozwala tworzyc kity i je migrowac
    default: op
  boxpvp.admin:
    description: Pozwala zarzadzac generatorami blokow i handlarzami
    default: op
